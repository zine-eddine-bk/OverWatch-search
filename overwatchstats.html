<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats</title>
    <link rel="stylesheet" href="overwatch.css">
    <link rel="icon" type="webp" href="image\icon.webp">
</head>
<body>
    <header>
        <button id="menubutton" onclick="togglemenu()">⋮</button>
        <div id="menupanel" hidden>
            <a href="overwatch.html">Hero Search</a>
            <a href="overwatchstats.html">Hero Stats</a>
        </div>
        <h1>Overwatch Stats</h1>
        <div id="statssearchbox">
            <select id="platformselect">
                <option value="pc">PC</option>
                <option value="console">Console</option>
            </select>
            <select id="gamemodeselect">
                <option value="competitive">Competitive</option>
                <option value="quickplay">QuickPlay</option>
            </select>
            <select id="regionselect">
                <option value="europe">Europe</option>
                <option value="americas">Americas</option>
                <option value="asia">Asia</option>
            </select><br>
            <button id="getallstatsbutt" onclick="getAllHeroStats()">Show Stats</button>
            <pre id="statsoutput"></pre>
        </div>
    </header>
        <main>
        <table id="statstable" hidden>
            <thead>
                <tr>
                    <th>Hero</th>
                    <th class="sortable" onclick="this.dataset.order = this.dataset.order==='descending' ? 'ascending' : 'descending'; arrangtable(this.dataset.order,'Pick rate')">Pick rate %</th>
                    <th class="sortable" onclick="this.dataset.order = this.dataset.order==='descending' ? 'ascending' : 'descending'; arrangtable(this.dataset.order,'Win rate')">Win rate %</th>
                    <th class="sortable" onclick="this.dataset.order = this.dataset.order==='descending' ? 'ascending' : 'descending'; arrangtable(this.dataset.order,'Ban rate')">Ban rate %</th>
                </tr>
            </thead>
            <tbody id="statsbody"></tbody>
        </table>
    </main>
    <script src="overwatchstats.js"></script>
</body>
</html>
